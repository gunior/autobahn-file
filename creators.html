<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <script>!function(){var t=sessionStorage.getItem("page-transition-theme");if(t)document.documentElement.setAttribute("data-pt",t)}();</script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="assets/a-b.png">
  <link rel="icon" type="image/png" href="assets/a-w.png" media="(prefers-color-scheme: dark)">
  <link rel="apple-touch-icon" href="assets/a-b.png">
  <title>Autobahn — Team</title>
  <link rel="stylesheet" href="./design.css">
  <style>
    /* ── Variables manquantes (système Figma 1920px de html-v2) ── */
    :root {
      --u:       calc(100vw / 1920);
      --c-cream: rgba(245, 244, 240, 0.92);
      --radius:  calc(5 * var(--u));
    }

    html, body { background: #000; color: var(--c-cream); }
    body {
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }
    body { scrollbar-width: none; }
    body::-webkit-scrollbar { display: none; }

    /* ── Tokens coverflow ── */
    :root {
      --card-w:       calc(200 * var(--u));
      --card-photo-h: calc(200 * var(--u));
      --card-label-h: calc(50  * var(--u));
      --card-h:       calc(var(--card-photo-h) + var(--card-label-h));
      --floor-y:      calc(170 * var(--u));
      --card-base:    calc(40  * var(--u));
      --floor-gap:    calc(20  * var(--u));
    }

    /* ── Zone scrollable de 200vh — donne de la marge avant le footer ── */
    main.team-main {
      position: relative;
      flex: 0 0 auto;
      height: 200vh;
      overflow: visible;
      isolation: isolate;
      z-index: 1;
      background: #000;
    }

    /* ── Wrapper sticky : toute la scène colle en haut du viewport ── */
    .scene-sticky {
      position: sticky;
      top: var(--nav-height);
      width: 100%;
      height: calc(100vh - var(--nav-height));
    }

    /* ── Fond "ciel" : showreel du créateur sélectionné ── */
    .scene-top {
      position: absolute;
      top: 0; left: 0; right: 0;
      bottom: var(--floor-y);
      z-index: 0;
      overflow: hidden;
      background: #000;
    }
    .scene-top video {
      position: absolute;
      inset: 0;
      width: 100%; height: 100%;
      object-fit: cover;
      opacity: 0;
      transition: opacity 0.6s ease;
    }
    .scene-top video.active { opacity: 0.55; }
    .scene-top::after {
      content: '';
      position: absolute; inset: 0;
      background:
        radial-gradient(ellipse 85% 80% at 50% 80%, rgba(0,0,0,0) 0%, rgba(0,0,0,0.4) 70%, rgba(0,0,0,0.8) 100%),
        linear-gradient(180deg, rgba(0,0,0,0.5) 0%, rgba(0,0,0,0) 35%);
      pointer-events: none;
    }

    /* ── Ligne du sol ── */
    .floor-line {
      position: absolute;
      left: 0; right: 0;
      bottom: var(--floor-y);
      height: 1px;
      background: rgba(255,255,255,0.28);
      z-index: 1;
      pointer-events: none;
    }

    /* ── Sol = showreel inversé à 10% ── */
    .floor-mirror {
      position: absolute;
      left: 0; right: 0;
      bottom: 0;
      height: var(--floor-y);
      z-index: 0;
      overflow: hidden;
      background: #000;
    }
    .floor-mirror video {
      position: absolute;
      inset: 0;
      width: 100%; height: 100%;
      object-fit: cover;
      transform: scaleY(-1);
      filter: blur(calc(4 * var(--u)));
      opacity: 0;
      transition: opacity 0.6s ease;
    }
    .floor-mirror video.active { opacity: 0.10; }

    /* ── Scène coverflow ── */
    .coverflow-stage {
      position: absolute;
      inset: 0;
      z-index: 5;
      perspective: calc(1600 * var(--u));
      perspective-origin: 50% 50%;
      overflow: visible;
      user-select: none;
      -webkit-user-select: none;
      cursor: grab;
    }
    .coverflow-stage:active { cursor: grabbing; }
    .coverflow-stage * { user-select: none; -webkit-user-select: none; }

    .coverflow-track {
      position: absolute;
      left: 50%;
      bottom: var(--card-base);
      transform-style: preserve-3d;
      will-change: transform;
    }

    /* ── Cartes ── */
    .cf-card {
      position: absolute;
      left: calc(-1 * var(--card-w) / 2);
      bottom: 0;
      width: var(--card-w);
      height: var(--card-h);
      transform-style: preserve-3d;
      transition: transform 0.6s cubic-bezier(0.22, 0.61, 0.36, 1),
                  opacity   0.5s ease;
      cursor: pointer;
    }

    /* Reflet — prolongé loin vers le bas */
    .cf-card .card-mirror {
      position: absolute;
      top: 100%;
      margin-top: var(--floor-gap);
      left: 0; right: 0;
      height: calc(var(--card-h) * 3);
      overflow: hidden;
      transform: scaleY(-1);
      background: var(--bg, #222);
      filter: blur(calc(4 * var(--u)));
      pointer-events: none;
    }
    .cf-card .card-mirror > .face {
      position: absolute;
      bottom: 0;
      left: 0; right: 0;
      height: var(--card-photo-h);
      box-shadow: none;
    }

    /* Photo 1:1 en haut de la carte */
    .cf-card .face {
      position: absolute;
      top: 0; left: 0; right: 0;
      height: var(--card-photo-h);
      border-radius: var(--radius);
      overflow: hidden;
      background: var(--bg, #222);
      box-shadow: 0 calc(20 * var(--u)) calc(50 * var(--u)) rgba(0,0,0,0.6);
    }
    .cf-card .face img,
    .cf-card .face video {
      width: 100%; height: 100%;
      object-fit: cover;
      display: block;
    }
    .cf-card .face::after {
      content: '';
      position: absolute; inset: 0;
      background: linear-gradient(180deg, rgba(0,0,0,0) 65%, rgba(0,0,0,0.35) 100%);
      pointer-events: none;
    }

    /* Label nom + rôle — visible uniquement sur la carte centrée */
    .cf-card .label {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: var(--card-label-h);
      padding-top: calc(8 * var(--u));
      font-family: var(--f-mono);
      color: var(--c-cream);
      text-align: center;
      text-transform: uppercase;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.35s ease 0.15s;
    }
    .cf-card.is-current .label { opacity: 1; }
    .cf-card .label .l-name {
      font-size: calc(14 * var(--u));
      line-height: 1.05;
      letter-spacing: 0.02em;
    }
    .cf-card .label .l-role {
      margin-top: calc(4 * var(--u));
      font-size: calc(10 * var(--u));
      line-height: 1.1;
      letter-spacing: 0.04em;
      opacity: 0.7;
    }

    /* ── Footer ── */
    .site-footer {
      position: relative;
      z-index: 20;
      flex-shrink: 0;
      width: 100%;
      height: calc(186 * var(--u));
      background: var(--c-bg);
      color: var(--c-ink);
      font-family: var(--f-mono);
      font-size: calc(18 * var(--u));
      line-height: calc(20 * var(--u));
      text-transform: uppercase;
    }
    .site-footer a { color: inherit; text-decoration: none; transition: opacity 0.2s ease; }
    .site-footer a:hover { opacity: 0.55; }
    .site-footer .ft-left {
      position: absolute;
      top: calc(146 * var(--u));
      left: calc(37 * var(--u));
    }
    .site-footer .ft-links {
      position: absolute;
      top: calc(146 * var(--u));
      right: calc(36 * var(--u));
      display: flex;
      gap: calc(60 * var(--u));
      list-style: none;
    }
  </style>
</head>
<body class="lang-en">

  <!-- Navigation injectée par nav.js -->
  <nav></nav>

  <main class="team-main">
    <div class="scene-sticky">
      <!-- Showreel "ciel" du créateur sélectionné -->
      <div class="scene-top">
        <video id="teamBg" autoplay muted loop playsinline></video>
      </div>
      <!-- Sol = showreel inversé 10% -->
      <div class="floor-mirror">
        <video id="teamBgMirror" autoplay muted loop playsinline></video>
      </div>
      <!-- Ligne du sol -->
      <div class="floor-line"></div>

      <!-- Coverflow -->
      <div class="coverflow-stage" id="cfStage">
        <div class="coverflow-track" id="cfTrack"></div>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <span class="ft-left">2026/Autobahn</span>
    <ul class="ft-links">
      <li><a href="/mentions-legales">Legal n0tices</a></li>
      <li><a href="/privacy">Privacy p0licy</a></li>
      <li><a href="https://www.instagram.com/autobahn_studio/" target="_blank" rel="noopener">Instagram</a></li>
    </ul>
  </footer>

  <!-- Navigation partagée -->
  <script src="./nav.js"></script>

  <script>
    /* ============================================================
       COVERFLOW — données créateurs
       ============================================================ */
    const creators = [
      { slug:'guillaume', name:'ESTRADE Guillaume',   role:'Motion Designer & Director',           bg:'#1A2ED5' },
      { slug:'antonin',   name:'REBIC Antonin',       role:'Creative Technologist · Motion & VFX', bg:'#5B1FE8' },
      { slug:'marine',    name:'GUILLAUME Marine',    role:'Creative Producer · IA × 3D',          bg:'#7B1FA2' },
      { slug:'oceane',    name:'PESSET Océane',       role:'Motion Design & Illustration',         bg:'#D14A6E' },
      { slug:'victor',    name:'MAITRE Victor',       role:'Composer & Sound Designer',            bg:'#0F6E56' },
      { slug:'johan',     name:'PETIT Johan',         role:'2D/3D Motion Designer · Art Director', bg:'#993C1D' },
      { slug:'simon',     name:'DURENDEAU Simon',     role:'3D Artist',                            bg:'#3C3489' },
      { slug:'clement',   name:'LE GAD Clément',      role:'3D Artist',                            bg:'#26215C' },
      { slug:'delphy',    name:'BRIOIS Delphy',       role:'Art Director · Motion & Illustration', bg:'#854F0B' },
      { slug:'romain',    name:'DIJON Romain',        role:'Art Director & Motion',                bg:'#1F4A0E' },
      { slug:'alexandre', name:'PARAGEAUD Alexandre', role:'3D Artist',                            bg:'#5F5E5A' },
    ];

    const track    = document.getElementById('cfTrack');
    const bgVid    = document.getElementById('teamBg');
    const bgMirror = document.getElementById('teamBgMirror');

    /* ── Construction des cartes ── */
    creators.forEach((c, i) => {
      const card = document.createElement('div');
      card.className = 'cf-card';
      card.dataset.index = i;
      card.style.setProperty('--bg', c.bg);

      const initial     = (c.name.split(' ').pop() || '').charAt(0);
      const parts       = c.name.split(' ');
      const displayName = (parts.length > 1 ? parts.slice(1).join(' ') : parts[0]).toUpperCase();

      const faceHTML = `
        <div class="face" style="background:${c.bg};">
          <div style="
            display:flex;align-items:center;justify-content:center;
            width:100%;height:100%;
            font-family:var(--f-sans);
            font-size:calc(120 * var(--u));
            color:rgba(255,255,255,0.85);
            line-height:1;
            text-shadow:0 calc(2 * var(--u)) calc(20 * var(--u)) rgba(0,0,0,0.45);
          ">${initial}</div>
        </div>`;

      card.innerHTML = `
        ${faceHTML}
        <div class="label">
          <div class="l-name">${displayName}</div>
          <div class="l-role">${c.role}</div>
        </div>
        <div class="card-mirror" aria-hidden="true">${faceHTML}</div>
      `;

      card.addEventListener('click', () => {
        if (i === current) {
          window.location.href = `./creators/${c.slug}/`;
        } else {
          setCurrent(i);
        }
      });

      track.appendChild(card);
    });

    const cards = Array.from(track.children);

    /* ── Layout 3D + loop infini ──
       Même config iTunes : gap large au centre, cluster serré sur les côtés */
    const N = creators.length;

    function wrap(d) {
      const half = N / 2;
      let v = ((d % N) + N) % N;
      if (v > half) v -= N;
      return v;
    }

    const prevD = new Array(N).fill(null);

    function layout(centerIdx) {
      const centerGap  = 170;
      const tightStep  = 50;
      const rot        = 70;
      const zBack      = -200;
      const fadeByDist = [1, 1, 1, 1, 0.7, 0.3, 0.1];
      const u = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--u')) || 1;

      cards.forEach((card, i) => {
        const d  = wrap(i - centerIdx);
        const ad = Math.abs(d);
        let x, z, r, scale;

        if (d === 0) {
          x = 0; z = 0; r = 0; scale = 1;
        } else {
          const sign   = d > 0 ? 1 : -1;
          const offset = centerGap + (ad - 1) * tightStep;
          x     = sign * offset;
          z     = zBack;
          r     = -sign * rot;
          scale = 0.92;
        }

        const prev    = prevD[i];
        const wrapped = prev !== null && Math.abs(d - prev) > N / 2;
        if (wrapped) card.style.transition = 'none';

        card.style.transform = `translateX(${x * u}px) translateZ(${z * u}px) rotateY(${r}deg) scale(${scale})`;
        card.style.zIndex    = 100 - ad;
        card.style.opacity   = ad < fadeByDist.length ? fadeByDist[ad] : 0;
        card.classList.toggle('is-current', d === 0);

        if (wrapped) {
          card.offsetHeight;
          requestAnimationFrame(() => { card.style.transition = ''; });
        }
        prevD[i] = d;
      });
    }

    let current = 0;

    function setCurrent(i) {
      current = ((i % N) + N) % N;
      layout(current);
      const c       = creators[current];
      const tryUrl  = `./creators/${c.slug}/creator-showreel-${c.slug}.mp4`;
      const fallback = './videos/mini-vid-opt.mp4';
      fetch(tryUrl, { method: 'HEAD' })
        .then(r => setBg(r.ok ? tryUrl : fallback))
        .catch(() => setBg(fallback));
    }

    function setBg(url) {
      if (bgVid.dataset.url === url) return;
      bgVid.dataset.url    = url;
      bgMirror.dataset.url = url;
      [bgVid, bgMirror].forEach(v => v.classList.remove('active'));
      bgVid.src    = url; bgVid.load();
      bgMirror.src = url; bgMirror.load();
      const playBoth = () => {
        bgVid.currentTime = bgMirror.currentTime = 0;
        bgVid.play().catch(() => {});
        bgMirror.play().catch(() => {});
      };
      bgVid.addEventListener('loadeddata', playBoth, { once: true });
      requestAnimationFrame(() => {
        bgVid.classList.add('active');
        bgMirror.classList.add('active');
      });
    }

    /* ── Navigation : flèches clavier ── */
    window.addEventListener('keydown', e => {
      if      (e.key === 'ArrowRight') setCurrent(current + 1);
      else if (e.key === 'ArrowLeft')  setCurrent(current - 1);
      else if (e.key === 'Enter') {
        window.location.href = `./creators/${creators[current].slug}/`;
      }
    });

    /* ── Drag / pointer ── */
    let dragStartX   = null;
    let dragStartIdx = 0;
    const stage      = document.getElementById('cfStage');

    stage.addEventListener('pointerdown', e => {
      dragStartX   = e.clientX;
      dragStartIdx = current;
      stage.setPointerCapture(e.pointerId);
    });
    stage.addEventListener('pointermove', e => {
      if (dragStartX == null) return;
      const dx    = e.clientX - dragStartX;
      const step  = window.innerWidth / 14;
      const delta = -Math.round(dx / step);
      const target = dragStartIdx + delta;
      if (target !== current) setCurrent(target);
    });
    stage.addEventListener('pointerup',     () => { dragStartX = null; });
    stage.addEventListener('pointercancel', () => { dragStartX = null; });

    /* ── Wheel ── */
    let wheelLock = 0;
    stage.addEventListener('wheel', e => {
      const u = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--u')) || 1;
      const cardsZoneH = (40 + 250 + 60) * u;
      const rect       = stage.getBoundingClientRect();
      if ((e.clientY - rect.top) <= (rect.height - cardsZoneH)) return;
      e.preventDefault();
      const now = Date.now();
      if (now - wheelLock < 250) return;
      wheelLock = now;
      const delta = Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY;
      setCurrent(current + (delta > 0 ? 1 : -1));
    }, { passive: false });

    /* Init : Victor au centre pour un rendu agréable au chargement */
    setCurrent(4);
  </script>

</body>
</html>
