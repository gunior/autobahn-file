<div id="autobahn-wheel-wrap-v2" style="position: relative; width: 100%; min-height: 720px; background: #0a0a08; border-radius: var(--border-radius-lg); overflow: hidden; font-family: 'Inter', -apple-system, sans-serif;">

  <div style="position: absolute; top: 16px; left: 16px; z-index: 90; font-family: 'Inter', sans-serif; font-weight: 300; font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: rgba(245,244,240,0.5);">Preview · team v2.1</div>

  <div style="position: absolute; top: 16px; right: 16px; z-index: 50; font-family: 'Inter', sans-serif; color: rgba(245,244,240,0.9); text-align: right;">
    <div id="aw2-idx-cur" style="font-weight: 500; font-size: 20px; letter-spacing: -0.02em; line-height: 1;">01</div>
    <div style="width: 24px; height: 1px; background: rgba(245,244,240,0.25); margin: 6px 0 6px auto;"></div>
    <div id="aw2-idx-total" style="font-weight: 300; font-size: 12px; color: rgba(245,244,240,0.4); line-height: 1;">13</div>
  </div>

  <div id="aw2-stage-outer" style="position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; pointer-events: none;">
    <div id="aw2-stage" style="position: relative; height: 100%; width: min(100%, calc(100% * 16 / 9)); perspective: 1400px; pointer-events: none;">
      <div id="aw2-inner" style="position: relative; width: 100%; height: 100%; transform-style: preserve-3d; opacity: 0; transform: translateY(60px); transition: opacity 0.8s cubic-bezier(0.25,0.46,0.45,0.94), transform 0.8s cubic-bezier(0.25,0.46,0.45,0.94);"></div>
    </div>
  </div>

  <div id="aw2-hint" style="position: absolute; left: 50%; bottom: 32px; transform: translateX(-50%); z-index: 50; font-family: 'Inter', sans-serif; font-weight: 300; font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; color: rgba(245,244,240,0.45); pointer-events: none; display: flex; flex-direction: column; align-items: center; gap: 8px; transition: opacity 0.4s ease;">
    Scroll · arrow keys
    <span id="aw2-hint-pulse" style="width: 1px; height: 18px; background: linear-gradient(to bottom, rgba(245,244,240,0.6), transparent);"></span>
  </div>

  <div style="position: absolute; bottom: 0; left: 0; right: 0; height: 100px; background: linear-gradient(to top, rgba(0,0,0,0.6), transparent); pointer-events: none; z-index: 5;"></div>
  <div style="position: absolute; top: 0; left: 0; right: 0; height: 80px; background: linear-gradient(to bottom, rgba(0,0,0,0.5), transparent); pointer-events: none; z-index: 5;"></div>
</div>

<style>
  #autobahn-wheel-wrap-v2 .wcard2 {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 360px;
    aspect-ratio: 16 / 9;
    transform-origin: center center;
    cursor: pointer;
    transition: transform 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94), opacity 0.45s ease, filter 0.5s ease;
    pointer-events: all;
    will-change: transform, opacity;
  }
  #autobahn-wheel-wrap-v2 .wcard2-inner {
    position: relative;
    width: 100%; height: 100%;
    overflow: hidden;
    border-radius: 2px;
    display: flex; align-items: center; justify-content: center;
  }
  #autobahn-wheel-wrap-v2 .wcard2-initial {
    font-family: 'Inter', sans-serif;
    font-weight: 500;
    font-size: 88px;
    color: rgba(255,255,255,0.85);
    letter-spacing: -0.04em;
    line-height: 1;
  }
  #autobahn-wheel-wrap-v2 .wcard2-overlay {
    position: absolute; inset: 0;
    background: linear-gradient(to top, rgba(0,0,0,0.92) 0%, rgba(0,0,0,0.35) 50%, transparent 80%);
    opacity: 0;
    transition: opacity 0.4s ease;
  }
  #autobahn-wheel-wrap-v2 .wcard2.active .wcard2-overlay { opacity: 1; }
  #autobahn-wheel-wrap-v2 .wcard2-info {
    position: absolute; bottom: 0; left: 0; right: 0;
    padding: 14px 18px 16px;
    transform: translateY(8px);
    opacity: 0;
    transition: transform 0.45s cubic-bezier(0.25,0.46,0.45,0.94) 0.05s, opacity 0.4s ease 0.05s;
  }
  #autobahn-wheel-wrap-v2 .wcard2.active .wcard2-info { transform: translateY(0); opacity: 1; }
  #autobahn-wheel-wrap-v2 .wcard2-name {
    font-family: 'Inter', sans-serif;
    font-weight: 500;
    font-size: 16px;
    letter-spacing: -0.01em;
    color: rgba(255,255,255,0.96);
    line-height: 1.05;
    margin: 0;
  }
  #autobahn-wheel-wrap-v2 .wcard2-role {
    font-family: 'Inter', sans-serif;
    font-weight: 300;
    font-size: 11px;
    letter-spacing: 0.06em;
    color: rgba(255,255,255,0.55);
    margin-top: 6px;
  }
  #autobahn-wheel-wrap-v2 #aw2-hint-pulse {
    animation: aw2-pulse 2s ease-in-out infinite;
  }
  @keyframes aw2-pulse {
    0%,100% { transform: translateY(0); opacity: 0.7; }
    50%     { transform: translateY(6px); opacity: 0.2; }
  }
  #autobahn-wheel-wrap-v2 #aw2-hint.fade { opacity: 0; }
</style>

<script>
(function() {
  const wrap   = document.getElementById('autobahn-wheel-wrap-v2');
  if (!wrap) return;
  const inner  = document.getElementById('aw2-inner');
  const idxCur = document.getElementById('aw2-idx-cur');
  const idxTot = document.getElementById('aw2-idx-total');
  const hint   = document.getElementById('aw2-hint');

  const creators = [
    { name: 'ESTRADE Guillaume',   role: 'Motion Designer & Director',           bg: '#1A2ED5' },
    { name: 'REBIC Antonin',       role: 'Creative Technologist · Motion & VFX', bg: '#5B1FE8' },
    { name: 'GUILLAUME Marine',    role: 'Creative Producer · IA × 3D',          bg: '#7B1FA2' },
    { name: 'PESSET Océane',       role: 'Motion design & Illustration',         bg: '#D14A6E' },
    { name: 'MAITRE Victor',       role: 'Composer & Sound Designer',            bg: '#0F6E56' },
    { name: 'PETIT Johan',         role: '2D/3D Motion Designer, Art Director', bg: '#993C1D' },
    { name: 'DURENDEAU Simon',     role: '3D Artist',                             bg: '#3C3489' },
    { name: 'LE GAD Clément',      role: '3D Artist',                             bg: '#26215C' },
    { name: 'BRIOIS Delphy',       role: 'Art Director, Motion & Illustration', bg: '#854F0B' },
    { name: 'DIJON Romain',        role: 'Art Director & Motion',                 bg: '#1F4A0E' },
    { name: 'PARAGEAUD Alexandre', role: '3D Artist',                             bg: '#5F5E5A' },
    { name: 'CEBRANT Antoine',     role: 'Illustration & Motion design',          bg: '#0C447C' },
    { name: 'Patrick',             role: 'Human Resources',                       bg: '#4A1B0C' },
  ];

  const STEP_PX       = 280;
  const SHOW_RADIUS   = 4;
  const THRESHOLD_IN  = 0.90;
  const THRESHOLD_OUT = 0.10;

  let activeIdx     = 0;
  let virtualScroll = 0;
  let snapRaf       = null;

  function initial(name) {
    const parts = (name || '').trim().split(/\s+/);
    const first = parts[parts.length - 1] || '';
    return first.charAt(0).toUpperCase();
  }

  const cardEls = creators.map((c, i) => {
    const el = document.createElement('div');
    el.className = 'wcard2';
    el.innerHTML = `
      <div class="wcard2-inner" style="background:${c.bg};">
        <div class="wcard2-initial">${initial(c.name)}</div>
        <div class="wcard2-overlay"></div>
        <div class="wcard2-info">
          <div class="wcard2-name">${c.name}</div>
          <div class="wcard2-role">${c.role}</div>
        </div>
      </div>`;
    el.addEventListener('click', () => onCardClick(i));
    inner.appendChild(el);
    return el;
  });

  idxTot.textContent = String(creators.length).padStart(2, '0');

  function render() {
    const idx = virtualScroll / STEP_PX;
    cardEls.forEach((el, i) => {
      const offset = i - idx;
      const absO   = Math.abs(offset);
      if (absO > SHOW_RADIUS) {
        el.style.opacity = '0';
        el.style.pointerEvents = 'none';
        return;
      }
      const sign = offset === 0 ? 0 : (offset > 0 ? 1 : -1);
      const yBase = offset * 220;
      const yPull = sign * Math.pow(absO, 1.2) * 55;
      const translateY = yBase + yPull;
      const scale   = Math.max(0.55, 1 - absO * 0.12);
      const opacity = Math.max(0.08, 1 - absO * 0.26);
      const rotateX = sign * Math.min(40, absO * 12);
      const zIndex  = Math.round(100 - absO * 10);

      el.style.opacity = opacity;
      el.style.pointerEvents = absO < 0.6 ? 'all' : 'none';
      el.style.zIndex = zIndex;
      el.style.transform = `translate(-50%, calc(-50% + ${translateY}px)) scale(${scale}) rotateX(${rotateX}deg)`;
      el.classList.toggle('active', absO < 0.5);
      el.style.filter = absO > 0.8 ? `blur(${Math.min(3, (absO - 0.8) * 3)}px)` : 'none';
    });

    const base = Math.floor(idx);
    const next = base + 1;
    const progress = idx - base;
    let newActive;
    if (progress >= THRESHOLD_IN)            newActive = next;
    else if (progress <= THRESHOLD_OUT)      newActive = base;
    else if (activeIdx === base || activeIdx === next) newActive = activeIdx;
    else newActive = base;
    newActive = Math.max(0, Math.min(creators.length - 1, newActive));

    if (newActive !== activeIdx) {
      activeIdx = newActive;
      idxCur.textContent = String(activeIdx + 1).padStart(2, '0');
    }
  }

  function smoothTo(target) {
    if (snapRaf) cancelAnimationFrame(snapRaf);
    const start = virtualScroll;
    const diff  = target - start;
    if (Math.abs(diff) < 0.5) { virtualScroll = target; render(); return; }
    const dur = 480;
    const t0  = performance.now();
    function step(now) {
      const p = Math.min(1, (now - t0) / dur);
      const ease = p < 0.5 ? 4*p*p*p : 1 - Math.pow(-2*p + 2, 3) / 2;
      virtualScroll = start + diff * ease;
      render();
      if (p < 1) snapRaf = requestAnimationFrame(step);
      else      { snapRaf = null; virtualScroll = target; render(); }
    }
    snapRaf = requestAnimationFrame(step);
  }

  function snapToNearest() {
    const idx = Math.round(virtualScroll / STEP_PX);
    const clamped = Math.max(0, Math.min(creators.length - 1, idx));
    smoothTo(clamped * STEP_PX);
  }

  function onCardClick(i) {
    if (i === activeIdx) {
      const slug = creators[i].name.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/\s+/g, '-').replace(/[^a-z0-9-]/g, '');
      sendPrompt('Click sur ' + creators[i].name + ' → ouvrirait la page profil (slug: ' + slug + ')');
    } else {
      smoothTo(i * STEP_PX);
    }
  }

  let wheelTimeout = null;
  wrap.addEventListener('wheel', (e) => {
    e.preventDefault();
    hint.classList.add('fade');
    if (snapRaf) { cancelAnimationFrame(snapRaf); snapRaf = null; }
    virtualScroll = Math.max(0, Math.min((creators.length - 1) * STEP_PX, virtualScroll + e.deltaY * 0.8));
    render();
    clearTimeout(wheelTimeout);
    wheelTimeout = setTimeout(snapToNearest, 140);
  }, { passive: false });

  let touchStartY = 0, touchLastY = 0, touchMoved = false;
  wrap.addEventListener('touchstart', (e) => {
    touchStartY = e.touches[0].clientY;
    touchLastY  = touchStartY;
    touchMoved  = false;
    if (snapRaf) { cancelAnimationFrame(snapRaf); snapRaf = null; }
  }, { passive: true });
  wrap.addEventListener('touchmove', (e) => {
    e.preventDefault();
    const y  = e.touches[0].clientY;
    const dy = touchLastY - y;
    touchLastY = y;
    if (Math.abs(y - touchStartY) > 6) touchMoved = true;
    virtualScroll = Math.max(0, Math.min((creators.length - 1) * STEP_PX, virtualScroll + dy));
    render();
    hint.classList.add('fade');
  }, { passive: false });
  wrap.addEventListener('touchend', () => { if (touchMoved) snapToNearest(); });

  function keyHandler(e) {
    if (!wrap.matches(':hover') && document.activeElement !== wrap) return;
    if (e.key === 'ArrowDown' || e.key === ' ') {
      e.preventDefault();
      smoothTo(Math.min(creators.length - 1, activeIdx + 1) * STEP_PX);
      hint.classList.add('fade');
    } else if (e.key === 'ArrowUp') {
      e.preventDefault();
      smoothTo(Math.max(0, activeIdx - 1) * STEP_PX);
      hint.classList.add('fade');
    } else if (e.key === 'Enter') {
      if (activeIdx >= 0) onCardClick(activeIdx);
    }
  }
  window.addEventListener('keydown', keyHandler);

  /* Apparition : fade-in + slide-up de la roue entière, virtualScroll reste à 0
     (pas d'animation interne de scroll, donc pas d'effet de rotation au départ) */
  render();
  requestAnimationFrame(() => {
    inner.style.opacity = '1';
    inner.style.transform = 'translateY(0)';
  });
})();
</script>
