<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lab — Autobahn</title>
  <link rel="stylesheet" href="./design.css">
  <style>

    /* ══════════════════════════════════════════
       STYLES SPÉCIFIQUES À LA PAGE LAB
    ══════════════════════════════════════════ */

    /* ── Page header ── */
    .page-header {
      padding: 140px var(--space-lg) 64px;
      display: flex; align-items: flex-end; justify-content: space-between;
      border-bottom: var(--border-weight) solid var(--c-border);
      transition: var(--transition-theme);
    }
    .page-title {
      font-family: var(--f-display);
      font-size: clamp(48px, 8vw, 96px);
      font-weight: var(--fw-regular); line-height: 0.9;
      letter-spacing: -0.03em; color: var(--c-ink); transition: color 0.4s;
    }
    .page-desc {
      font-size: 14px; color: var(--c-slate); max-width: 280px;
      line-height: 1.75; text-align: right; padding-bottom: 8px;
    }

    /* ── Lab canvas ── */
    .lab-canvas {
      position: relative; width: 100%; min-height: 200vh;
    }

    /* ── Lab item ── */
    .lab-item {
      position: absolute; ; overflow: hidden;
      opacity: 0; transform: translateY(20px);
      transition: opacity 0.6s ease, transform 0.6s ease;
    }
    .lab-item.visible { opacity: 1; transform: translateY(0); }

    .lab-item img,
    .lab-item video {
      width: 100%; height: auto;
      display: block;
      transition: transform 0.5s cubic-bezier(0.25,0.46,0.45,0.94);
    }
    .lab-item:hover img,
    .lab-item:hover video { transform: scale(1.03); }

    .lab-placeholder {
      width: 100%; height: 200px;
      background: var(--c-surface);
      display: flex; align-items: center; justify-content: center;
      font-family: var(--f-mono); font-size: 10px; letter-spacing: 0.1em;
      text-transform: uppercase; color: var(--c-ash);
      transition: background 0.4s, color 0.4s;
    }

    .lab-empty {
      padding: 120px var(--space-lg);
      font-family: var(--f-mono); font-size: var(--fs-label); letter-spacing: 0.1em;
      text-transform: uppercase; color: var(--c-ash);
      text-align: center;
    }

    /* ── Lab item — cursor pointer ── */
    .lab-item { cursor: zoom-in; }

    /* ── Lightbox ── */
    #lightbox {
      position: fixed; inset: 0; z-index: 500;
      display: flex; align-items: center; justify-content: center;
      opacity: 0; pointer-events: none;
      transition: opacity 0.35s ease;
    }
    #lightbox.open { opacity: 1; pointer-events: all; }

    #lightbox-backdrop {
      position: absolute; inset: 0;
      background: rgba(13, 13, 12, 0.75);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }

    #lightbox-img {
      position: relative; z-index: 1;
      max-width: 88vw;
      max-height: 88vh;
      object-fit: contain;
      border-radius: 2px;
      transform: scale(0.94);
      transition: transform 0.35s cubic-bezier(0.25, 0.46, 0.45, 0.94);
      box-shadow: 0 32px 80px rgba(0,0,0,0.45);
    }
    #lightbox.open #lightbox-img { transform: scale(1); }

    #lightbox-close {
      position: absolute; top: 28px; right: 32px; z-index: 2;
      background: none; border: none;
      font-family: var(--f-mono); font-size: 11px; letter-spacing: 0.12em;
      text-transform: uppercase; color: rgba(245,244,240,0.5);
      transition: color 0.2s;
      cursor: pointer;
    }
    #lightbox-close:hover { color: rgba(245,244,240,0.9); }

    /* ── Footer ── */
    footer {
      border-top: var(--border-weight) solid var(--c-border);
      padding: var(--space-md) var(--space-lg);
      display: flex; justify-content: space-between;
      margin-top: 80px; transition: border-color 0.4s;
    }
    .footer-copy, .footer-tag {
      font-family: var(--f-mono); font-size: var(--fs-label);
      color: var(--c-ash); letter-spacing: var(--ls-normal);
    }

    /* ══════════════════════════════════════════
       MODE ARCHIVE — toggle + grille + scrollbar
    ══════════════════════════════════════════ */

    /* Toggle Archive / Lab — fixé sur le côté droit, écriture verticale */
    .lab-mode-toggle {
      position: fixed;
      right: 18px;
      top: 50%;
      transform: translateY(-50%);
      writing-mode: vertical-rl;
      background: none;
      border: none;
      font-family: var(--f-mono);
      font-size: 10px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--c-slate);
      cursor: pointer;
      z-index: 60;
      padding: 12px 6px;
      transition: color 0.2s ease, transform 0.2s ease;
      user-select: none;
    }
    .lab-mode-toggle:hover {
      color: var(--c-ink);
      transform: translateY(-50%) translateX(-2px);
    }

    /* Le toggle affiche un seul label suivant le mode courant */
    body[data-lab-mode="collage"] .toggle-label-archive { display: none; }
    body[data-lab-mode="archive"] .toggle-label-collage { display: none; }

    /* Affichage exclusif : collage XOR archive */
    body[data-lab-mode="archive"] #labCanvas { display: none; }
    body[data-lab-mode="collage"] #labArchive { display: none; }

    /* En mode archive on masque la scrollbar native — la barre custom prend le relais */
    body[data-lab-mode="archive"] {
      scrollbar-width: none;
      -ms-overflow-style: none;
    }
    body[data-lab-mode="archive"]::-webkit-scrollbar { display: none; }

    /* Grille archive */
    .lab-archive {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 2px;
      padding: 32px var(--space-lg) 80px;
      background: var(--c-bg);
      transition: background 0.4s;
    }
    .archive-cell {
      position: relative;
      aspect-ratio: 1 / 1;
      overflow: hidden;
      background: var(--c-surface);
      cursor: zoom-in;
      transition: transform 0.25s ease, z-index 0s linear 0.25s;
    }
    .archive-cell img,
    .archive-cell video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.4s ease;
    }
    .archive-cell:hover {
      transform: scale(1.04);
      z-index: 2;
      transition: transform 0.25s ease, z-index 0s;
    }
    .archive-cell:hover img,
    .archive-cell:hover video { transform: scale(1.02); }

    @media (max-width: 1200px) {
      .lab-archive { grid-template-columns: repeat(5, 1fr); }
    }
    @media (max-width: 768px) {
      .lab-archive { grid-template-columns: repeat(3, 1fr); padding: 16px 12px 60px; }
    }

    /* ── Scrollbar custom — visible uniquement en archive pendant le scroll ── */
    .scroll-indicator {
      position: fixed;
      right: 6px;
      top: 96px;
      bottom: 96px;
      width: 2px;
      z-index: 50;
      opacity: 0;
      transition: opacity 0.4s ease, width 0.2s ease;
      pointer-events: none;
    }
    body[data-lab-mode="archive"] .scroll-indicator.scrolling {
      opacity: 1;
      width: 4px;
    }
    body[data-lab-mode="collage"] .scroll-indicator { display: none; }

    .scroll-indicator-track {
      position: relative;
      width: 100%;
      height: 100%;
      background: rgba(245, 244, 240, 0.07);
      border-radius: 2px;
    }
    html[data-theme="light"] .scroll-indicator-track { background: rgba(26, 26, 24, 0.08); }

    .scroll-indicator-thumb {
      position: absolute;
      left: 0;
      width: 100%;
      background: rgba(245, 244, 240, 0.45);
      border-radius: 2px;
      transition: background 0.2s ease;
    }
    html[data-theme="light"] .scroll-indicator-thumb { background: rgba(26, 26, 24, 0.45); }

    .scroll-indicator.scrolling .scroll-indicator-thumb {
      background: rgba(245, 244, 240, 0.7);
    }
    html[data-theme="light"] .scroll-indicator.scrolling .scroll-indicator-thumb {
      background: rgba(26, 26, 24, 0.7);
    }

    /* Marqueurs de mois — petite ligne + label discret */
    .month-marker {
      position: absolute;
      left: -3px;
      width: 8px;
      height: 1px;
      background: rgba(245, 244, 240, 0.35);
      pointer-events: none;
    }
    .month-marker-label {
      position: absolute;
      right: 14px;
      transform: translateY(-50%);
      font-family: var(--f-mono);
      font-size: 8px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: rgba(245, 244, 240, 0.4);
      white-space: nowrap;
      pointer-events: none;
    }
    html[data-theme="light"] .month-marker { background: rgba(26, 26, 24, 0.35); }
    html[data-theme="light"] .month-marker-label { color: rgba(26, 26, 24, 0.4); }

  </style>
</head>
<body>

  <!-- Navigation injectée par nav.js -->
  <nav></nav>

  <header class="page-header">
    <div>
      <h1 class="page-title">Lab.</h1>
    </div>
    <p class="page-desc">
      <span class="en">No brief, no client. Pure exploration — a space to test, experiment and push creative boundaries.</span>
      <span class="fr">Sans brief, sans client. Pure exploration — un espace pour tester, expérimenter et repousser les limites créatives.</span>
    </p>
  </header>

  <!-- Toggle Archive / Lab (fixé sur le côté droit) -->
  <button class="lab-mode-toggle" id="labModeToggle" aria-label="Toggle archive view">
    <span class="toggle-label-collage">Archive</span>
    <span class="toggle-label-archive">Lab</span>
  </button>

  <!-- Scrollbar custom (uniquement en mode archive) -->
  <div class="scroll-indicator" id="scrollIndicator">
    <div class="scroll-indicator-track" id="scrollTrack">
      <div class="scroll-indicator-thumb" id="scrollThumb"></div>
      <!-- Les marqueurs de mois sont injectés dynamiquement ici -->
    </div>
  </div>

  <!-- Vue collage (originale) -->
  <main class="lab-canvas" id="labCanvas"></main>

  <!-- Vue archive (grille 7 colonnes, contact-sheet) -->
  <main class="lab-archive" id="labArchive"></main>

  <!-- Lightbox -->
  <div id="lightbox">
    <div id="lightbox-backdrop"></div>
    <img id="lightbox-img" src="" alt="">
    <button id="lightbox-close">✕ &nbsp;Close</button>
  </div>

  <footer>
    <div class="footer-copy">© 2025 Autobahn — All rights reserved</div>
    <div class="footer-tag">Based in Paris. Working worldwide.</div>
  </footer>

  <!-- Navigation partagée -->
  <script src="./nav.js"></script>

  <script>
  /* ── Layout engine ── */
  const MARGIN = window.innerWidth < 768 ? 16 : 48;
  const sizeProfiles = [
    { wRatio: [0.55, 0.72] },
    { wRatio: [0.28, 0.38] },
    { wRatio: [0.38, 0.52] },
    { wRatio: [0.20, 0.30] },
    { wRatio: [0.60, 0.78] },
    { wRatio: [0.32, 0.45] },
  ];
  const xPositions = [
    (cw, iw) => MARGIN,
    (cw, iw) => MARGIN + cw * 0.12,
    (cw, iw) => MARGIN + cw * 0.5 - iw * 0.5,
    (cw, iw) => MARGIN + cw * 0.5 - iw * 0.1,
    (cw, iw) => MARGIN + cw - iw - MARGIN * 0.5,
    (cw, iw) => MARGIN + cw * 0.25,
    (cw, iw) => MARGIN + cw * 0.6,
  ];
  function rand(min, max) { return min + Math.random() * (max - min); }

  const labCanvas = document.getElementById('labCanvas');
  let loadedCount = 0;
  let totalItems = 0;

  function buildLayout(items) {
    labCanvas.innerHTML = '';

    if (!items || items.length === 0) {
      labCanvas.innerHTML = `<div class="lab-empty">
        <span class="en">No content yet.</span>
        <span class="fr">Aucun contenu.</span>
      </div>`;
      return;
    }

    // Précharge tous les items (images et vidéos) pour connaître leurs dimensions
    const promises = items.map(item => new Promise(resolve => {
      if (item.type === 'video') {
        const vid = document.createElement('video');
        vid.muted     = true;
        vid.loop      = true;
        vid.playsInline = true;
        vid.preload   = 'metadata';
        // Fallback 16:9 si les métadonnées ne se chargent pas dans les 3s
        const timeout = setTimeout(() => resolve({ item, el: vid, w: 1920, h: 1080 }), 3000);
        vid.addEventListener('loadedmetadata', () => {
          clearTimeout(timeout);
          resolve({ item, el: vid, w: vid.videoWidth || 1920, h: vid.videoHeight || 1080 });
        }, { once: true });
        vid.addEventListener('error', () => { clearTimeout(timeout); resolve({ item, el: null }); }, { once: true });
        vid.src = item.url || `./lab/${item.file}`;
      } else {
        const img = new Image();
        img.onload  = () => resolve({ item, el: img,  w: img.naturalWidth,  h: img.naturalHeight });
        img.onerror = () => resolve({ item, el: null });
        img.src = item.url || `./lab/${item.file}`;
      }
    }));

    Promise.all(promises).then(results => {
      const vw = window.innerWidth;
      const cw = vw - MARGIN * 2;
      let currentY = 32;

      results.forEach((res, i) => {
        if (!res.el) return;

        const profile = sizeProfiles[i % sizeProfiles.length];
        const wRaw = Math.round(cw * rand(...profile.wRatio));
        const w = Math.round(Math.min(wRaw, res.w * 2)); // jamais plus de 2× la résolution native
        const h = Math.round(w * res.h / res.w);
        const xFn = xPositions[i % xPositions.length];
        const x = Math.max(MARGIN, Math.min(vw - w - MARGIN * 0.5, xFn(cw, w)));
        const y = currentY;

        const el = document.createElement('div');
        el.className = 'lab-item' + (res.item.type === 'video' ? ' lab-video-item' : '');
        el.style.cssText = `left:${x}px; top:${y}px; width:${w}px;`;

        res.el.style.width  = '100%';
        res.el.style.height = 'auto';
        el.appendChild(res.el);

        labCanvas.appendChild(el);
        currentY = y + h + Math.round(rand(40, 80));
      });

      labCanvas.style.height = (currentY + 80) + 'px';
      observeItems();
    });
  }

  function updateCanvasHeight() {
    const allItems = labCanvas.querySelectorAll('.lab-item');
    let maxBottom = 0;
    allItems.forEach(el => {
      const bottom = el.offsetTop + el.offsetHeight;
      if (bottom > maxBottom) maxBottom = bottom;
    });
    if (maxBottom > 0) labCanvas.style.height = (maxBottom + 80) + 'px';
  }

  function observeItems() {
    // Fade-in à l'entrée dans le viewport
    const fadeObserver = new IntersectionObserver(entries => {
      entries.forEach(e => {
        if (e.isIntersecting) {
          e.target.classList.add('visible');
          fadeObserver.unobserve(e.target);
        }
      });
    }, { threshold: 0.08, rootMargin: '0px 0px -40px 0px' });

    // Play/pause automatique des vidéos selon visibilité
    const videoObserver = new IntersectionObserver(entries => {
      entries.forEach(e => {
        const vid = e.target.querySelector('video');
        if (!vid) return;
        if (e.isIntersecting) { vid.play().catch(() => {}); }
        else                  { vid.pause(); }
      });
    }, { threshold: 0.1 });

    document.querySelectorAll('.lab-item').forEach(el => {
      fadeObserver.observe(el);
      if (el.classList.contains('lab-video-item')) videoObserver.observe(el);
    });
  }

  /* ══════════════════════════════════════════
     MODE ARCHIVE — toggle, grille, scrollbar custom
  ══════════════════════════════════════════ */

  // State
  let allItems    = null;
  let archiveBuilt = false;
  let viewMode    = localStorage.getItem('autobahn-lab-mode') || 'collage';
  document.body.dataset.labMode = viewMode;

  // Refs DOM
  const archiveEl   = document.getElementById('labArchive');
  const toggleEl    = document.getElementById('labModeToggle');
  const indicatorEl = document.getElementById('scrollIndicator');
  const trackEl     = document.getElementById('scrollTrack');
  const thumbEl     = document.getElementById('scrollThumb');

  /* ─ Construit la grille archive (7 colonnes desktop) ─ */
  function buildArchive(items) {
    archiveEl.innerHTML = '';

    if (!items || items.length === 0) {
      archiveEl.innerHTML = `<div class="lab-empty" style="grid-column: 1 / -1;">
        <span class="en">No content yet.</span>
        <span class="fr">Aucun contenu.</span>
      </div>`;
      return;
    }

    // Tri du plus récent au plus ancien (les items du manifest ont déjà ce tri,
    // mais on s'en assure ici au cas où le tri change côté build).
    const sorted = [...items].sort((a, b) => {
      const da = new Date(a.date || 0).getTime();
      const db = new Date(b.date || 0).getTime();
      return db - da;
    });

    sorted.forEach(item => {
      const cell = document.createElement('div');
      cell.className = 'archive-cell';
      cell.dataset.date = item.date || '';

      if (item.type === 'video') {
        const vid = document.createElement('video');
        vid.muted       = true;
        vid.loop        = true;
        vid.playsInline = true;
        vid.preload     = 'metadata'; // pas d'autoplay en archive : juste la 1re frame
        vid.src         = item.url || `./lab/${item.file}`;
        cell.appendChild(vid);
      } else {
        const img = document.createElement('img');
        img.src     = item.url || `./lab/${item.file}`;
        img.loading = 'lazy';
        img.alt     = '';
        cell.appendChild(img);
      }

      archiveEl.appendChild(cell);
    });
  }

  /* ─ Custom scrollbar : update position du thumb + marqueurs de mois ─ */
  let scrollHideTimer = null;
  let lastTrackHeight = 0;

  function updateScrollIndicator() {
    if (viewMode !== 'archive') return;

    const docHeight   = document.documentElement.scrollHeight;
    const winHeight   = window.innerHeight;
    const trackHeight = trackEl.offsetHeight;
    if (trackHeight === 0) return;

    // Taille + position du thumb
    const thumbHeight = Math.max(20, (winHeight / docHeight) * trackHeight);
    const scrollMax   = Math.max(0, docHeight - winHeight);
    const thumbY      = scrollMax > 0 ? (window.scrollY / scrollMax) * (trackHeight - thumbHeight) : 0;

    thumbEl.style.height = thumbHeight + 'px';
    thumbEl.style.top    = thumbY + 'px';

    // Recalcule les marqueurs si la hauteur a changé (resize, ou première render)
    if (trackHeight !== lastTrackHeight) {
      lastTrackHeight = trackHeight;
      buildMonthMarkers(docHeight, trackHeight);
    }
  }

  /* ─ Petites étapes par mois sur la barre custom ─ */
  const MONTH_NAMES = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];

  function buildMonthMarkers(docHeight, trackHeight) {
    // Purge les marqueurs précédents
    trackEl.querySelectorAll('.month-marker, .month-marker-label').forEach(el => el.remove());

    const cells = archiveEl.querySelectorAll('.archive-cell[data-date]');
    if (cells.length === 0) return;

    let prevKey = null;
    cells.forEach(cell => {
      const dateStr = cell.dataset.date;
      if (!dateStr) return;
      const d   = new Date(dateStr);
      if (isNaN(d.getTime())) return;
      const key = `${d.getFullYear()}-${d.getMonth()}`;
      if (key === prevKey) return;
      prevKey = key;

      // Position du premier item du mois sur la track
      const cellTop = cell.getBoundingClientRect().top + window.scrollY;
      const ratio   = Math.min(1, Math.max(0, cellTop / docHeight));
      const yOnTrack = ratio * trackHeight;

      const tick = document.createElement('div');
      tick.className = 'month-marker';
      tick.style.top = yOnTrack + 'px';
      trackEl.appendChild(tick);

      const label = document.createElement('div');
      label.className = 'month-marker-label';
      label.textContent = `${MONTH_NAMES[d.getMonth()]} ${d.getFullYear()}`;
      label.style.top = yOnTrack + 'px';
      trackEl.appendChild(label);
    });
  }

  /* ─ Toggle handler ─ */
  toggleEl.addEventListener('click', () => {
    viewMode = viewMode === 'collage' ? 'archive' : 'collage';
    document.body.dataset.labMode = viewMode;
    localStorage.setItem('autobahn-lab-mode', viewMode);
    window.scrollTo(0, 0);

    if (viewMode === 'archive') {
      if (!archiveBuilt && allItems) {
        buildArchive(allItems);
        archiveBuilt = true;
      }
      // Laisse le DOM se peindre avant de calculer les positions
      lastTrackHeight = 0;
      requestAnimationFrame(() => requestAnimationFrame(updateScrollIndicator));
    }
  });

  /* ─ Scroll listener : montre la barre puis fade out après 1.5s sans scroll ─ */
  window.addEventListener('scroll', () => {
    if (viewMode !== 'archive') return;
    updateScrollIndicator();
    indicatorEl.classList.add('scrolling');
    clearTimeout(scrollHideTimer);
    scrollHideTimer = setTimeout(() => {
      indicatorEl.classList.remove('scrolling');
    }, 1500);
  }, { passive: true });

  /* ══════════════════════════════════════════
     CHARGEMENT DU MANIFEST
  ══════════════════════════════════════════ */

  fetch('./lab/manifest.json')
    .then(r => {
      if (!r.ok) throw new Error('manifest not found');
      return r.json();
    })
    .then(items => {
      allItems = items;
      buildLayout(items);
      // Si l'utilisateur revient avec sa préférence "archive", on construit directement
      if (viewMode === 'archive') {
        buildArchive(items);
        archiveBuilt = true;
        requestAnimationFrame(() => requestAnimationFrame(updateScrollIndicator));
      }
    })
    .catch(() => {
      labCanvas.innerHTML = `
        <div class="lab-empty">
          <span class="en">Drop images or videos in the <code>lab/</code> folder, then deploy to Netlify.</span>
          <span class="fr">Dépose des images ou vidéos dans le dossier <code>lab/</code>, puis déploie sur Netlify.</span>
        </div>`;
    });

  window.addEventListener('resize', () => {
    fetch('./lab/manifest.json')
      .then(r => r.ok ? r.json() : [])
      .then(items => {
        allItems = items;
        buildLayout(items);
        if (viewMode === 'archive') {
          buildArchive(items);
          archiveBuilt = true;
          lastTrackHeight = 0;
          requestAnimationFrame(() => requestAnimationFrame(updateScrollIndicator));
        }
      })
      .catch(() => {});
  });

  /* ── Lightbox ── */
  const lightbox     = document.getElementById('lightbox');
  const lightboxImg  = document.getElementById('lightbox-img');
  const lightboxClose = document.getElementById('lightbox-close');
  const backdrop     = document.getElementById('lightbox-backdrop');

  function openLightbox(src) {
    lightboxImg.src = src;
    lightbox.classList.add('open');
    document.body.style.overflow = 'hidden';
  }

  function closeLightbox() {
    lightbox.classList.remove('open');
    document.body.style.overflow = '';
    setTimeout(() => { lightboxImg.src = ''; }, 350);
  }

  lightboxClose.addEventListener('click', closeLightbox);
  backdrop.addEventListener('click', closeLightbox);
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') closeLightbox();
  });

  // Délègue les clics sur les images du canvas (collage) et de la grille archive
  function handleLabClick(e) {
    const img = e.target.closest('.lab-item, .archive-cell')?.querySelector('img');
    if (img) openLightbox(img.src);
  }
  document.getElementById('labCanvas').addEventListener('click', handleLabClick);
  document.getElementById('labArchive').addEventListener('click', handleLabClick);
  </script>

</body>
</html>
